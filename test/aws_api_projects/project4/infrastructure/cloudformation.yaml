AWSTemplateFormatVersion: '2010-09-09'
Description: 'Customer Journey Optimization API - AWS Microservice'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Resources:
  # API Gateway
  CustomerJourneyApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub customer-journey-api-${Environment}
      Description: API for customer journey optimization services
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Resources and Methods
  ApiResourceJourney:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !GetAtt CustomerJourneyApi.RootResourceId
      PathPart: journey

  # Track Event Resource
  ApiResourceTrackEvent:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceJourney
      PathPart: track-event

  ApiMethodTrackEvent:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceTrackEvent
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # Create User Resource
  ApiResourceCreateUser:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceJourney
      PathPart: create-user

  ApiMethodCreateUser:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceCreateUser
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # Create Journey Resource
  ApiResourceCreateJourney:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceJourney
      PathPart: create-journey

  ApiMethodCreateJourney:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceCreateJourney
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # Add Touchpoint Resource
  ApiResourceAddTouchpoint:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceJourney
      PathPart: add-touchpoint

  ApiMethodAddTouchpoint:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceAddTouchpoint
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # Get Recommendations Resource
  ApiResourceGetRecommendations:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceJourney
      PathPart: get-recommendations

  ApiMethodGetRecommendations:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceGetRecommendations
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # Analyze Journey Resource
  ApiResourceAnalyze:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceJourney
      PathPart: analyze

  ApiMethodAnalyze:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceAnalyze
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # Users Resource
  ApiResourceUsers:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceJourney
      PathPart: users

  ApiMethodListUsers:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceUsers
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # User Details Resource
  ApiResourceUserDetails:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceUsers
      PathPart: '{user_id}'

  ApiMethodGetUser:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceUserDetails
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.user_id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # Journeys Resource
  ApiResourceJourneys:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceJourney
      PathPart: journeys

  ApiMethodListJourneys:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceJourneys
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # Journey Details Resource
  ApiResourceJourneyDetails:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ParentId: !Ref ApiResourceJourneys
      PathPart: '{journey_id}'

  ApiMethodGetJourney:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      ResourceId: !Ref ApiResourceJourneyDetails
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.journey_id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CustomerJourneyFunction.Arn}/invocations

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMethodTrackEvent
      - ApiMethodCreateUser
      - ApiMethodCreateJourney
      - ApiMethodAddTouchpoint
      - ApiMethodGetRecommendations
      - ApiMethodAnalyze
      - ApiMethodListUsers
      - ApiMethodGetUser
      - ApiMethodListJourneys
      - ApiMethodGetJourney
    Properties:
      RestApiId: !Ref CustomerJourneyApi
      StageName: !Ref Environment

  # Lambda Function
  CustomerJourneyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub customer-journey-api-${Environment}
      Runtime: python3.9
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          USERS_TABLE: !Ref UsersTable
          JOURNEYS_TABLE: !Ref JourneysTable
          TOUCHPOINTS_TABLE: !Ref TouchpointsTable
          EVENTS_STREAM: !Ref EventsStream
          PERSONALIZE_CAMPAIGN_ARN: !Ref PersonalizeCampaignArn
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Sub ${Environment}/customer-journey-api/lambda.zip

  # Lambda Permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CustomerJourneyFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CustomerJourneyApi}/*

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CustomerJourneyPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt JourneysTable.Arn
                  - !GetAtt TouchpointsTable.Arn
              - Effect: Allow
                Action:
                  - kinesis:PutRecord
                Resource: !GetAtt EventsStream.Arn
              - Effect: Allow
                Action:
                  - personalize:GetRecommendations
                Resource: '*'

  # DynamoDB Tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub customer-journey-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: user_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  JourneysTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub customer-journey-journeys-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: journey_id
          AttributeType: S
        - AttributeName: user_id
          AttributeType: S
      KeySchema:
        - AttributeName: journey_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: UserIdIndex
          KeySchema:
            - AttributeName: user_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  TouchpointsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub customer-journey-touchpoints-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: journey_id
          AttributeType: S
        - AttributeName: touchpoint_id
          AttributeType: S
      KeySchema:
        - AttributeName: journey_id
          KeyType: HASH
        - AttributeName: touchpoint_id
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # Kinesis Stream for Events
  EventsStream:
    Type: AWS::Kinesis::Stream
    Properties:
      Name: !Sub customer-journey-events-${Environment}
      ShardCount: 1
      RetentionPeriodHours: 24

  # S3 Bucket for Deployment Artifacts
  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub customer-journey-deployment-${Environment}-${AWS::AccountId}

  # Personalize Campaign ARN Parameter
  PersonalizeCampaignArn:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /customer-journey/${Environment}/personalize-campaign-arn
      Type: String
      Value: !Sub arn:aws:personalize:${AWS::Region}:${AWS::AccountId}:campaign/customer-journey-campaign
      Description: ARN of the Amazon Personalize campaign for customer journey recommendations

  # Analytics Pipeline (simplified)
  AnalyticsFirehoseRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: firehose.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonKinesisFirehoseServiceRole

  AnalyticsFirehose:
    Type: AWS::KinesisFirehose::DeliveryStream
    Properties:
      DeliveryStreamName: !Sub customer-journey-analytics-${Environment}
      DeliveryStreamType: KinesisStreamAsSource
      KinesisStreamSourceConfiguration:
        KinesisStreamARN: !GetAtt EventsStream.Arn
        RoleARN: !GetAtt AnalyticsFirehoseRole.Arn
      S3DestinationConfiguration:
        BucketARN: !GetAtt AnalyticsBucket.Arn
        BufferingHints:
          IntervalInSeconds: 60
          SizeInMBs: 5
        CompressionFormat: GZIP
        Prefix: events/
        RoleARN: !GetAtt AnalyticsFirehoseRole.Arn

  AnalyticsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub customer-journey-analytics-${Environment}-${AWS::AccountId}

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${CustomerJourneyApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  UsersTableName:
    Description: DynamoDB table for storing user data
    Value: !Ref UsersTable

  JourneysTableName:
    Description: DynamoDB table for storing journey data
    Value: !Ref JourneysTable

  TouchpointsTableName:
    Description: DynamoDB table for storing touchpoint data
    Value: !Ref TouchpointsTable

  EventsStreamName:
    Description: Kinesis stream for event data
    Value: !Ref EventsStream

  AnalyticsBucketName:
    Description: S3 bucket for analytics data
    Value: !Ref AnalyticsBucket
