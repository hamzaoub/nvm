AWSTemplateFormatVersion: '2010-09-09'
Description: 'AI Voice Generation API - AWS Microservice'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Resources:
  # API Gateway
  VoiceGenerationApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub voice-generation-api-${Environment}
      Description: API for AI voice generation services
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Resources and Methods
  ApiResourceVoice:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !GetAtt VoiceGenerationApi.RootResourceId
      PathPart: voice

  # Create Profile Resource
  ApiResourceCreateProfile:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !Ref ApiResourceVoice
      PathPart: create-profile

  ApiMethodCreateProfile:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ResourceId: !Ref ApiResourceCreateProfile
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VoiceGenerationFunction.Arn}/invocations

  # Generate Speech Resource
  ApiResourceGenerate:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !Ref ApiResourceVoice
      PathPart: generate

  ApiMethodGenerate:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ResourceId: !Ref ApiResourceGenerate
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VoiceGenerationFunction.Arn}/invocations

  # Adjust Emotion Resource
  ApiResourceAdjustEmotion:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !Ref ApiResourceVoice
      PathPart: adjust-emotion

  ApiMethodAdjustEmotion:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ResourceId: !Ref ApiResourceAdjustEmotion
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VoiceGenerationFunction.Arn}/invocations

  # Translate Resource
  ApiResourceTranslate:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !Ref ApiResourceVoice
      PathPart: translate

  ApiMethodTranslate:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ResourceId: !Ref ApiResourceTranslate
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VoiceGenerationFunction.Arn}/invocations

  # Batch Process Resource
  ApiResourceBatchProcess:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !Ref ApiResourceVoice
      PathPart: batch-process

  ApiMethodBatchProcess:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ResourceId: !Ref ApiResourceBatchProcess
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VoiceGenerationFunction.Arn}/invocations

  # Profiles Resource
  ApiResourceProfiles:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !Ref ApiResourceVoice
      PathPart: profiles

  ApiMethodListProfiles:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ResourceId: !Ref ApiResourceProfiles
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VoiceGenerationFunction.Arn}/invocations

  # Profile Details Resource
  ApiResourceProfileDetails:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !Ref ApiResourceProfiles
      PathPart: '{profile_id}'

  ApiMethodGetProfile:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ResourceId: !Ref ApiResourceProfileDetails
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.profile_id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VoiceGenerationFunction.Arn}/invocations

  # Jobs Resource
  ApiResourceJobs:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !Ref ApiResourceVoice
      PathPart: jobs

  # Job Details Resource
  ApiResourceJobDetails:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ParentId: !Ref ApiResourceJobs
      PathPart: '{job_id}'

  ApiMethodGetJob:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      ResourceId: !Ref ApiResourceJobDetails
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.job_id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${VoiceGenerationFunction.Arn}/invocations

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMethodCreateProfile
      - ApiMethodGenerate
      - ApiMethodAdjustEmotion
      - ApiMethodTranslate
      - ApiMethodBatchProcess
      - ApiMethodListProfiles
      - ApiMethodGetProfile
      - ApiMethodGetJob
    Properties:
      RestApiId: !Ref VoiceGenerationApi
      StageName: !Ref Environment

  # Lambda Function
  VoiceGenerationFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub voice-generation-api-${Environment}
      Runtime: python3.9
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          VOICE_PROFILES_TABLE: !Ref VoiceProfilesTable
          VOICE_JOBS_TABLE: !Ref VoiceJobsTable
          STORAGE_BUCKET: !Ref StorageBucket
          BATCH_JOB_QUEUE: !Ref BatchJobQueue
          BATCH_JOB_DEFINITION: !Ref BatchJobDefinition
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Sub ${Environment}/voice-generation-api/lambda.zip

  # Lambda Permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref VoiceGenerationFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${VoiceGenerationApi}/*

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: VoiceGenerationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt VoiceProfilesTable.Arn
                  - !GetAtt VoiceJobsTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                Resource: !Sub ${StorageBucket.Arn}/*
              - Effect: Allow
                Action:
                  - polly:SynthesizeSpeech
                Resource: '*'
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                Resource: '*'

  # DynamoDB Tables
  VoiceProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub voice-generation-profiles-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: profile_id
          AttributeType: S
      KeySchema:
        - AttributeName: profile_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  VoiceJobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub voice-generation-jobs-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
        - AttributeName: batch_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: BatchIdIndex
          KeySchema:
            - AttributeName: batch_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # S3 Bucket for Storage
  StorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub voice-generation-storage-${Environment}-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 3600

  # S3 Bucket for Deployment Artifacts
  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub voice-generation-deployment-${Environment}-${AWS::AccountId}

  # AWS Batch Resources
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: FARGATE
        MaxvCpus: 4
        Subnets:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup

  BatchJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnvironment
      State: ENABLED

  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities:
        - FARGATE
      ContainerProperties:
        Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/voice-generation:latest
        FargatePlatformConfiguration:
          PlatformVersion: LATEST
        ResourceRequirements:
          - Type: VCPU
            Value: '1'
          - Type: MEMORY
            Value: '2048'
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
      RetryStrategy:
        Attempts: 3

  BatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VoiceGenerationBatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${StorageBucket.Arn}/*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource: !GetAtt VoiceJobsTable.Arn

  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Voice Generation Batch jobs
      VpcId: !Ref VPC

  # VPC and Subnets (simplified - in a real scenario, you might reference existing ones)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub voice-generation-vpc-${Environment}

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub voice-generation-subnet-a-${Environment}

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub voice-generation-subnet-b-${Environment}

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${VoiceGenerationApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  VoiceProfilesTableName:
    Description: DynamoDB table for storing voice profiles
    Value: !Ref VoiceProfilesTable

  VoiceJobsTableName:
    Description: DynamoDB table for storing voice generation jobs
    Value: !Ref VoiceJobsTable

  StorageBucketName:
    Description: S3 bucket for storing voice samples and generated audio
    Value: !Ref StorageBucket

  BatchJobQueueName:
    Description: AWS Batch job queue for processing batch voice generation jobs
    Value: !Ref BatchJobQueue
