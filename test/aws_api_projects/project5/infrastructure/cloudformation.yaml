AWSTemplateFormatVersion: '2010-09-09'
Description: 'Synthetic Data Generation API - AWS Microservice'

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment environment

Resources:
  # API Gateway
  SyntheticDataApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub synthetic-data-api-${Environment}
      Description: API for synthetic data generation services
      EndpointConfiguration:
        Types:
          - REGIONAL

  # API Resources and Methods
  ApiResourceData:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !GetAtt SyntheticDataApi.RootResourceId
      PathPart: data

  # Generate Data Resource
  ApiResourceGenerate:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceData
      PathPart: generate

  ApiMethodGenerate:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceGenerate
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # Create Schema Resource
  ApiResourceCreateSchema:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceData
      PathPart: create-schema

  ApiMethodCreateSchema:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceCreateSchema
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # Generate Tabular Resource
  ApiResourceGenerateTabular:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceData
      PathPart: generate-tabular

  ApiMethodGenerateTabular:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceGenerateTabular
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # Generate Time Series Resource
  ApiResourceGenerateTimeSeries:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceData
      PathPart: generate-time-series

  ApiMethodGenerateTimeSeries:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceGenerateTimeSeries
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # Generate Text Resource
  ApiResourceGenerateText:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceData
      PathPart: generate-text

  ApiMethodGenerateText:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceGenerateText
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # Anonymize Data Resource
  ApiResourceAnonymize:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceData
      PathPart: anonymize

  ApiMethodAnonymize:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceAnonymize
      HttpMethod: POST
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # Datasets Resource
  ApiResourceDatasets:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceData
      PathPart: datasets

  ApiMethodListDatasets:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceDatasets
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # Dataset Details Resource
  ApiResourceDatasetDetails:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceDatasets
      PathPart: '{dataset_id}'

  ApiMethodGetDataset:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceDatasetDetails
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.dataset_id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # Jobs Resource
  ApiResourceJobs:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceData
      PathPart: jobs

  ApiMethodListJobs:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceJobs
      HttpMethod: GET
      AuthorizationType: NONE
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # Job Details Resource
  ApiResourceJobDetails:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ParentId: !Ref ApiResourceJobs
      PathPart: '{job_id}'

  ApiMethodGetJob:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref SyntheticDataApi
      ResourceId: !Ref ApiResourceJobDetails
      HttpMethod: GET
      AuthorizationType: NONE
      RequestParameters:
        method.request.path.job_id: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SyntheticDataFunction.Arn}/invocations

  # API Deployment
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - ApiMethodGenerate
      - ApiMethodCreateSchema
      - ApiMethodGenerateTabular
      - ApiMethodGenerateTimeSeries
      - ApiMethodGenerateText
      - ApiMethodAnonymize
      - ApiMethodListDatasets
      - ApiMethodGetDataset
      - ApiMethodListJobs
      - ApiMethodGetJob
    Properties:
      RestApiId: !Ref SyntheticDataApi
      StageName: !Ref Environment

  # Lambda Function
  SyntheticDataFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub synthetic-data-api-${Environment}
      Runtime: python3.9
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          DATASETS_TABLE: !Ref DatasetsTable
          JOBS_TABLE: !Ref JobsTable
          STORAGE_BUCKET: !Ref StorageBucket
          BATCH_JOB_QUEUE: !Ref BatchJobQueue
          BATCH_JOB_DEFINITION: !Ref BatchJobDefinition
      Code:
        S3Bucket: !Ref DeploymentBucket
        S3Key: !Sub ${Environment}/synthetic-data-api/lambda.zip

  # Lambda Permission for API Gateway
  LambdaApiGatewayPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref SyntheticDataFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${SyntheticDataApi}/*

  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SyntheticDataPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt DatasetsTable.Arn
                  - !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GeneratePresignedUrl
                Resource: !Sub ${StorageBucket.Arn}/*
              - Effect: Allow
                Action:
                  - batch:SubmitJob
                  - batch:DescribeJobs
                Resource: '*'

  # DynamoDB Tables
  DatasetsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub synthetic-data-datasets-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dataset_id
          AttributeType: S
      KeySchema:
        - AttributeName: dataset_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub synthetic-data-jobs-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: job_id
          AttributeType: S
      KeySchema:
        - AttributeName: job_id
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # S3 Bucket for Storage
  StorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub synthetic-data-storage-${Environment}-${AWS::AccountId}
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
            AllowedOrigins:
              - '*'
            MaxAge: 3600

  # S3 Bucket for Deployment Artifacts
  DeploymentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub synthetic-data-deployment-${Environment}-${AWS::AccountId}

  # AWS Batch Resources
  BatchServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: batch.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBatchServiceRole

  BatchComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Properties:
      Type: MANAGED
      ServiceRole: !GetAtt BatchServiceRole.Arn
      ComputeResources:
        Type: FARGATE
        MaxvCpus: 4
        Subnets:
          - !Ref SubnetA
          - !Ref SubnetB
        SecurityGroupIds:
          - !Ref BatchSecurityGroup

  BatchJobQueue:
    Type: AWS::Batch::JobQueue
    Properties:
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref BatchComputeEnvironment
      State: ENABLED

  BatchJobDefinition:
    Type: AWS::Batch::JobDefinition
    Properties:
      Type: container
      PlatformCapabilities:
        - FARGATE
      ContainerProperties:
        Image: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/synthetic-data:latest
        FargatePlatformConfiguration:
          PlatformVersion: LATEST
        ResourceRequirements:
          - Type: VCPU
            Value: '1'
          - Type: MEMORY
            Value: '2048'
        ExecutionRoleArn: !GetAtt BatchExecutionRole.Arn
        JobRoleArn: !GetAtt BatchJobRole.Arn
      RetryStrategy:
        Attempts: 3

  BatchExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  BatchJobRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SyntheticDataBatchPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${StorageBucket.Arn}/*
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:UpdateItem
                  - dynamodb:PutItem
                Resource:
                  - !GetAtt DatasetsTable.Arn
                  - !GetAtt JobsTable.Arn

  BatchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Synthetic Data Batch jobs
      VpcId: !Ref VPC

  # VPC and Subnets (simplified - in a real scenario, you might reference existing ones)
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub synthetic-data-vpc-${Environment}

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub synthetic-data-subnet-a-${Environment}

  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub synthetic-data-subnet-b-${Environment}

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub https://${SyntheticDataApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}

  DatasetsTableName:
    Description: DynamoDB table for storing datasets and schemas
    Value: !Ref DatasetsTable

  JobsTableName:
    Description: DynamoDB table for storing data generation jobs
    Value: !Ref JobsTable

  StorageBucketName:
    Description: S3 bucket for storing generated data
    Value: !Ref StorageBucket

  BatchJobQueueName:
    Description: AWS Batch job queue for processing large data generation jobs
    Value: !Ref BatchJobQueue
